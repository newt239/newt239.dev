name: Quality
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"
          cache: pnpm
      - name: Setup dependencies
        run: |
          if [ -n "$CHROMEWEBDRIVER" ]; then
            export CHROMEDRIVER_FILEPATH="$CHROMEWEBDRIVER/chromedriver"
          fi
          pnpm install --frozen-lockfile
      - name: Generate
        run: pnpm run generate
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Run axe
        run: |
          pnpm run serve:static &
          curl --retry 30 --retry-all-errors --retry-delay 1 -sf -o /dev/null http://localhost:3100/
          pnpm run a11y
