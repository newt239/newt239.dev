version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: "main"
    # typescript-eslint の peer が typescript <6.1.0 のため、7 系に上げると ESLint がクラッシュする
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: "main"
    groups:
      github-actions:
        patterns:
          - "*"
